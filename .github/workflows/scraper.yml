name: MangaFlow Intel Scout Bot

on:
  schedule:
    # Runs at the top of every hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mangaflow-intel-scout
  cancel-in-progress: true

jobs:
  scout-intel:
    name: Scout & Index Source Intel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Recon Intel Scout
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_NO_WARNINGS: 1
        run: node scripts/scout-intel.js

      - name: Automatically Trigger Ingestion Relay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scout pass complete. Triggering ingestion workers..."
          gh workflow run scraper.yml || echo "Workflow trigger passed or already running."
