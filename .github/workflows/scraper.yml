name: Scrape Secondary Chapters

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Verify Secret Presence
        env:
          URL_CHECK: ${{ secrets.SUPABASE_URL }}
          KEY_CHECK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL_CHECK" ]; then
            echo "❌ SUPABASE_URL is EMPTY or NOT FOUND in GitHub Secrets"
          else
            echo "✅ SUPABASE_URL is detected"
          fi

          if [ -z "$KEY_CHECK" ]; then
            echo "❌ SUPABASE_SERVICE_ROLE_KEY is EMPTY or NOT FOUND in GitHub Secrets"
          else
            echo "✅ SUPABASE_SERVICE_ROLE_KEY is detected"
          fi

      - name: Run Chapter Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-secondary-chapters.js
