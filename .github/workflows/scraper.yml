name: MangaFlow Auto-Relay Bot & Health Repair

on:
  schedule:
    - cron: '*/5 * * * *' # Backup timer if runner queues stall
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mangaflow-backfill-matrix
  cancel-in-progress: false

jobs:
  token-relay:
    name: token-relay (${{ matrix.worker_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        worker_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Accelerated Multi-Source Worker Pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: 5
          NODE_NO_WARNINGS: 1
          RUN_DURATION_MINUTES: 25
        run: node scripts/sync-multi-source.js

  auto-retrigger:
    name: Auto-Trigger Next Pass
    needs: token-relay
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Consecutive Workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking if there are more empty chapters to process..."
          gh workflow run "MangaFlow Auto-Relay Bot & Health Repair" --repo "${{ github.repository }}" || true
