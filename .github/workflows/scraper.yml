name: MangaFlow Auto-Relay Bot & Health Repair

on:
  schedule:
    # Runs automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Prevents overlapping runs from competing or triggering rate limits
concurrency:
  group: mangaflow-backfill-matrix
  cancel-in-progress: false

jobs:
  token-relay:
    name: token-relay (${{ matrix.worker_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        worker_id: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Accelerated Multi-Source Worker Pass
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_ID: ${{ matrix.worker_id }}
          TOTAL_WORKERS: 5
          NODE_NO_WARNINGS: 1
        run: node scripts/sync-multi-source.js
