name: MangaFlow Gap Sweeper & Epilogue Auditor (45-Min)

on:
  schedule:
    # Runs at :07 and :52 past every hour (45-min interval offset to avoid top-of-hour congestion)
    - cron: '7,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangaflow-sweeper
  cancel-in-progress: false

jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Multi-Lane Gap Stitcher & Status Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: node scripts/sync-multi-source.js
