name: MangaFlow Catalog Normalize & Recover

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 4:00 AM UTC
  workflow_dispatch:

concurrency:
  group: mangaflow-normalize
  cancel-in-progress: false

jobs:
  normalize-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Normalization & Metadata Recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: node scripts/normalize-titles.js
