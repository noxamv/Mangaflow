  chain-next-relay:
    needs: token-relay
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Next Single Relay Pass
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const workflowsRes = await github.rest.actions.listRepoWorkflows({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const targetWorkflow = workflowsRes.data.workflows.find(
                (w) => w.name === context.workflow
              );

              if (!targetWorkflow) return;

              // Check if another run is already queued or in progress before creating a new one
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: targetWorkflow.id,
                status: 'queued'
              });

              if (runs.data.total_count > 0) {
                console.log('A pass is already queued. Skipping extra dispatch.');
                return;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: targetWorkflow.id,
                ref: 'main'
              });
              console.log('✓ Successfully queued 1 next relay pass.');
            } catch (err) {
              console.log('Chain dispatch notice:', err.message);
            }
