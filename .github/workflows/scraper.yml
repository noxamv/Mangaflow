name: MangaFlow Autonomous Catalog Sync

on:
  schedule:
    # Runs every 90 minutes; offsets prevent scheduling conflicts
    - cron: '0 */3,30 1-23/3 * * *'
  workflow_dispatch: # Allows manual click triggers anytime

# Ensures only ONE runner executes at a time. No self-starting overlaps.
concurrency:
  group: mangaflow-catalog-sync
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Hard timeout safety guard

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Stage 1 - Fast Trending & Popular Discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: node scripts/sync-recent.js

      - name: Stage 2 - Deep Catalog Backlog Sweeper & Gap Auditor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
        run: node scripts/sync-multi-source.js
