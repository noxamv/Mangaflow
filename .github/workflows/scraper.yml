name: MangaFlow Auto-Relay Bot & Health Repair

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  token-relay:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3
      matrix:
        worker: [1, 2, 3]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Accelerated Multi-Source Worker Pass
        run: node scripts/sync-multi-source.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORKER_ID: ${{ matrix.worker }}
          TOTAL_WORKERS: 3

  chain-next-relay:
    needs: token-relay
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Trigger Next Relay Pass
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sync-and-backfill.yml',
                ref: 'main'
              });
              console.log('Next 3-worker matrix pass triggered successfully.');
            } catch (err) {
              console.log('Chaining trigger completed or skipped:', err.message);
            }
